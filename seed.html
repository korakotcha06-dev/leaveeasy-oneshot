<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใส่ข้อมูลตัวอย่าง — LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

  <header class="toolbar">
    <h1>ใส่ข้อมูลตัวอย่าง</h1>
    <span class="nav-link" data-testid="auth-state"></span>
  </header>

  <main>
    <section class="card">
      <p>
        ปุ่มนี้เขียนข้อมูลตัวอย่างตามสเปกหัวข้อ 7 ลงฐานข้อมูล
        ได้แก่ ผู้ใช้ 3 คน ประเภทการลา 3 แบบ ใบขอลา 5 ใบ และความเห็นการอนุมัติ 4 รายการ
      </p>
      <p>
        กดซ้ำได้ไม่เสียหาย เพราะทุกไฟล์ถูกเขียนทับที่ชื่อไฟล์เดิม
        ไม่ได้สร้างไฟล์ใหม่เพิ่มทุกครั้งที่กด
      </p>
      <p class="empty" data-testid="seed-target"></p>

      <div class="toolbar">
        <button class="btn btn-primary" type="button" data-testid="seed-button">ใส่ข้อมูลตัวอย่าง</button>
      </div>

      <p class="field-error" data-testid="error-message" hidden></p>
      <p data-testid="seed-status"></p>
      <ul class="table" data-testid="seed-log"></ul>
    </section>
  </main>

  <script type="module" src="js/seed.js"></script>
</body>
</html>
