<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ยื่นใบลาใหม่ — LeaveEasy</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- nav-root ถูกเติมเนื้อหาโดย js/nav.js ตอนโหลดหน้า (ดูรูปแบบเดียวกับ index.html) -->
<div id="nav-root"></div>

<main class="page">
  <h1 class="page-title">ยื่นใบลาใหม่</h1>

  <!-- ช่องแสดงข้อผิดพลาดช่องเดียวของทั้งหน้า ใช้ร่วมกันทั้งการโหลดข้อมูลและการบันทึก -->
  <p class="error-message" data-testid="error-message" hidden></p>

  <form id="new-request-form" class="card" novalidate>
    <div class="field">
      <label class="field-label" for="input-title">หัวข้อ</label>
      <input
        class="field-input"
        id="input-title"
        data-testid="field-title"
        type="text"
        name="title"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label class="field-label" for="input-reason">เหตุผลการลา</label>
      <textarea
        class="field-input"
        id="input-reason"
        data-testid="field-reason"
        name="reason"
        rows="4"
      ></textarea>
    </div>

    <!--
      ปุ่ม AI วางไว้ตรงนี้เพราะมันอ่านค่าจากช่องเหตุผลด้านบน แล้วเติมผลลงช่องประเภทด้านล่าง
      ตำแหน่งนี้ทำให้เห็นความสัมพันธ์ของสามช่องนี้ชัดเจนที่สุด (สเปกข้อ 8 / US-09)
    -->
    <div class="field">
      <button type="button" class="btn btn-ghost" data-testid="ai-classify-button">
        ให้ AI ช่วยจัดประเภทการลา
      </button>
      <p
        class="field-hint"
        data-testid="ai-notice"
        style="color: var(--color-primary); font-size: 0.9rem; margin: var(--space-2) 0 0;"
        hidden
      >
        ข้อเสนอจาก AI — โปรดตรวจสอบก่อนยืนยัน
      </p>
    </div>

    <div class="field">
      <label class="field-label" for="input-leave-type">ประเภทการลา</label>
      <select
        class="field-input"
        id="input-leave-type"
        data-testid="field-leave-type"
        name="leaveTypeId"
      ></select>
    </div>

    <div class="field">
      <label class="field-label" for="input-start-date">วันที่เริ่มลา</label>
      <input
        class="field-input"
        id="input-start-date"
        data-testid="field-start-date"
        type="date"
        name="startDate"
      />
    </div>

    <div class="field">
      <label class="field-label" for="input-end-date">วันที่สิ้นสุด</label>
      <input
        class="field-input"
        id="input-end-date"
        data-testid="field-end-date"
        type="date"
        name="endDate"
      />
    </div>

    <div class="toolbar">
      <button type="submit" class="btn btn-primary" data-testid="save-button">บันทึก</button>
      <button type="button" class="btn btn-ghost" data-testid="cancel-button">ยกเลิก</button>
    </div>
  </form>
</main>

<script type="module" src="js/nav.js"></script>
<script type="module" src="js/new-leave-request.js"></script>
</body>
</html>
