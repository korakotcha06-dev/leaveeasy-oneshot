<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยื่นใบลาใหม่ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/new-leave-request.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ยื่นใบลาใหม่</h1>
    <p class="subtitle">กรอกให้ครบทุกช่อง แล้วกดบันทึก · ใบลาใหม่จะมีสถานะ รอพิจารณา เสมอ</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden" role="alert"></div>

      <!-- novalidate = ปิดข้อความเตือนของเบราว์เซอร์ ให้ JS คุมข้อความภาษาไทยเอง
           ส่วน required ยังอยู่ เพื่อบอกโปรแกรมอ่านหน้าจอว่าช่องนี้จำเป็น -->
      <form id="ฟอร์มใบลา" novalidate>
        <label for="title">หัวข้อ</label>
        <input type="text" id="title" required placeholder="เช่น ลาพักร้อนไปเที่ยวกับครอบครัว">

        <label for="reason">เหตุผลการลา</label>
        <textarea id="reason" required placeholder="เล่าเหตุผลสั้น ๆ ให้หัวหน้าเข้าใจ"></textarea>

        <label for="leaveTypeId">ประเภทการลา</label>
        <select id="leaveTypeId" required>
          <option value="">— เลือกประเภทการลา —</option>
        </select>

        <!-- ปุ่ม AI ระดับ 1 (สัปดาห์ที่ 8) · กดแล้ว AI อ่านเหตุผล แล้วเสนอประเภทให้ คนยังแก้เองได้เสมอ -->
        <div class="btn-row">
          <button type="button" class="btn-ghost" id="ปุ่มAIจัดประเภท"><span data-icon="sparkles"></span>ให้ AI ช่วยจัดประเภทการลา</button>
        </div>
        <p class="hint">AI อ่านเฉพาะช่องเหตุผลการลา · อย่าใส่ข้อมูลส่วนตัวจริง เช่น ชื่อโรค เลขบัตร เบอร์โทร</p>
        <div id="ผลAIจัดประเภท" class="alert alert-ai hidden" aria-live="polite"></div>

        <label for="startDate">วันที่เริ่มลา</label>
        <input type="date" id="startDate" required>

        <label for="endDate">วันที่สิ้นสุด</label>
        <input type="date" id="endDate" required>

        <div class="btn-row">
          <button type="submit" id="ปุ่มบันทึก">บันทึก</button>
          <a class="btn btn-ghost" href="leave-requests.html">ยกเลิก</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
