<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div class="navbar"><span class="brand"><span data-icon="calendar-check"></span>LeaveEasy</span></div>

  <div class="container" style="max-width:520px">
    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ต้องล็อกอินก่อน จึงจะเปิดดูใบลาได้</p>

    <div id="ข้อความเตือน" class="alert alert-error hidden" role="alert"></div>

    <div class="card">
      <h2>มีบัญชีอยู่แล้ว</h2>
      <label for="อีเมลเข้า">อีเมล</label>
      <input type="email" id="อีเมลเข้า" autocomplete="username" placeholder="somchai@example.com">

      <label for="รหัสผ่านเข้า">รหัสผ่าน</label>
      <input type="password" id="รหัสผ่านเข้า" autocomplete="current-password">

      <div class="btn-row">
        <button type="button" id="ปุ่มเข้าสู่ระบบ">เข้าสู่ระบบ</button>
      </div>
    </div>

    <div class="card">
      <h2>ยังไม่มีบัญชี — สมัครสมาชิก</h2>
      <p class="hint">บัญชีที่สมัครใหม่ทุกบัญชีจะได้บทบาทเป็น ผู้ขอลา (employee)</p>

      <label for="ชื่อสมัคร">ชื่อ-นามสกุล</label>
      <input type="text" id="ชื่อสมัคร" placeholder="เช่น สมชาย ใจดี">

      <label for="อีเมลสมัคร">อีเมล</label>
      <input type="email" id="อีเมลสมัคร" autocomplete="username" placeholder="somchai@example.com">

      <label for="รหัสผ่านสมัคร">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
      <input type="password" id="รหัสผ่านสมัคร" autocomplete="new-password">

      <div class="btn-row">
        <button type="button" class="btn-ghost" id="ปุ่มสมัคร">สมัครสมาชิก</button>
      </div>
    </div>
  </div>
</body>
</html>
