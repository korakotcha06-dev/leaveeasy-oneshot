<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

  <header class="toolbar">
    <h1>LeaveEasy</h1>
    <!-- ชื่อผู้ใช้ที่ล็อกอินอยู่ · ว่างเปล่าเมื่อยังไม่ได้ล็อกอิน -->
    <span class="nav-link" data-testid="auth-state"></span>
  </header>

  <!--
    ช่องแสดงข้อผิดพลาดมีช่องเดียวใช้ร่วมกันทั้งสองฟอร์ม
    ตั้งใจไม่ทำช่องละฟอร์ม เพราะ data-testid="error-message" ต้องมีแค่ตัวเดียวในหน้า
    ไม่อย่างนั้นชุดทดสอบจะหาเจอสองตัวแล้วไม่รู้ว่าจะอ่านตัวไหน
  -->
  <p class="field-error" data-testid="error-message" hidden></p>

  <main>
    <section class="card">
      <h2>เข้าสู่ระบบ</h2>
      <form id="form-signin" novalidate>
        <div class="field">
          <label class="field-label" for="signin-email">อีเมล</label>
          <input class="field-input" id="signin-email" data-testid="signin-email"
                 type="email" name="email" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label" for="signin-password">รหัสผ่าน</label>
          <input class="field-input" id="signin-password" data-testid="signin-password"
                 type="password" name="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" data-testid="signin-submit">เข้าสู่ระบบ</button>
      </form>
    </section>

    <section class="card">
      <h2>สมัครสมาชิก</h2>
      <p>ผู้สมัครใหม่ทุกคนได้บทบาท ผู้ขอลา (employee) การเปลี่ยนบทบาททำในหน้าจัดการของผู้ดูแลระบบเท่านั้น</p>
      <form id="form-signup" novalidate>
        <div class="field">
          <label class="field-label" for="signup-name">ชื่อ-นามสกุล</label>
          <input class="field-input" id="signup-name" data-testid="signup-name"
                 type="text" name="name" autocomplete="name">
        </div>
        <div class="field">
          <label class="field-label" for="signup-email">อีเมล</label>
          <input class="field-input" id="signup-email" data-testid="signup-email"
                 type="email" name="email" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label" for="signup-password">รหัสผ่าน</label>
          <input class="field-input" id="signup-password" data-testid="signup-password"
                 type="password" name="password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" type="submit" data-testid="signup-submit">สมัครสมาชิก</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
